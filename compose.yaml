services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.dev
    container_name: jongerenkaart-app
    working_dir: /var/www/html
    ports:
      - "8000:8000"
    volumes:
      - ./src:/var/www/html
      - composer-cache:/tmp/composer-cache
    environment:
      COMPOSER_CACHE_DIR: /tmp/composer-cache
      MONGODB_URI: mongodb://mongodb:27017/jongerenkaart
      MEILISEARCH_HOST: http://meilisearch:7700
      MEILISEARCH_KEY: local-development-key
    depends_on:
      - mongodb
      - meilisearch
    networks:
      - jongerenkaart

  nginx:
    image: nginx:1.27-alpine
    container_name: jongerenkaart-nginx
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - jongerenkaart

  mongodb:
    image: mongo:8.0
    container_name: jongerenkaart-mongodb
    ports:
      - "27018:27017"
    volumes:
      - ./data/mongodb:/data/db
      - ./docker/mongodb:/scripts:ro
      - ./inventaris_sociale_kaart.organisaties.json:/backups/inventaris_sociale_kaart.organisaties.json:ro
    networks:
      - jongerenkaart

  meilisearch:
    image: getmeili/meilisearch:v1.14
    container_name: jongerenkaart-meilisearch
    ports:
      - "7700:7700"
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: local-development-key
      MEILI_DB_PATH: /meili_data
    volumes:
      - ./data/meilisearch/db:/meili_data
    networks:
      - jongerenkaart

volumes:
  composer-cache:

networks:
  jongerenkaart:
    driver: bridge

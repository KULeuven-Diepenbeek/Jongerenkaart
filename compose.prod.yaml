x-production-logging: &production-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

services:
  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    environment:
      APP_URL: ${APP_URL:?APP_URL is required}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/caddy:/etc/caddy:ro
      - ./data/caddy/data:/data
      - ./data/caddy/config:/config
    depends_on:
      - nginx
    logging: *production-logging
    networks:
      - edge

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.prod
    image: jongerenkaart-app:prod
    restart: unless-stopped
    environment:
      APP_KEY: ${APP_KEY:?APP_KEY is required}
      APP_URL: ${APP_URL:?APP_URL is required}
      APP_ENV: production
      APP_DEBUG: "false"
      APP_MAINTENANCE_DRIVER: file
      LOG_CHANNEL: stderr
      DB_CONNECTION: mongodb
      MONGODB_URI: mongodb://mongodb:27017/jongerenkaart
      MONGODB_DATABASE: jongerenkaart
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: file
      SESSION_LIFETIME: "60"
      SESSION_ABSOLUTE_LIFETIME: "60"
      SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-false}
      TRUSTED_PROXIES: "*"
      SCOUT_DRIVER: meilisearch
      MEILISEARCH_HOST: http://meilisearch:7700
      MEILISEARCH_KEY: ${MEILISEARCH_KEY:-change-me-in-production}
    volumes:
      - ./data/public-assets:/var/www/html/public
    depends_on:
      - mongodb
      - meilisearch
    logging: *production-logging
    networks:
      - backend

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./data/public-assets:/var/www/html/public:ro
      - ./docker/nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    logging: *production-logging
    networks:
      - edge
      - backend

  mongodb:
    # MongoDB 8.x cannot start on Linux kernel 6.19+ (SERVER-121912).
    # Keep production on 7.0 until MongoDB publishes a compatible 8.x release.
    image: mongo:7.0.37
    restart: unless-stopped
    volumes:
      - ./data/mongodb:/data/db
      - ./docker/mongodb:/scripts:ro
      - ./inventaris_sociale_kaart.organisaties.json:/backups/inventaris_sociale_kaart.organisaties.json:ro
    logging: *production-logging
    networks:
      - backend

  meilisearch:
    image: getmeili/meilisearch:v1.14
    restart: unless-stopped
    environment:
      MEILI_ENV: production
      MEILI_MASTER_KEY: ${MEILISEARCH_KEY:-change-me-in-production}
      MEILI_DB_PATH: /meili_data
    volumes:
      - ./data/meilisearch/db:/meili_data
    logging: *production-logging
    networks:
      - backend

  portainer:
    image: portainer/portainer-ce:2.39.5-alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data/portainer:/data
    logging: *production-logging
    networks:
      - management

networks:
  edge:
    driver: bridge
  backend:
    driver: bridge
  management:
    driver: bridge
